plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

// 从 local.properties 读取签名配置（local.properties 不会被提交到 Git）
def keystoreProperties = new Properties()
def keystoreFile = file('keystore/release.keystore')
if (keystoreFile.exists()) {
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        keystoreProperties.load(localPropsFile.newDataInputStream())
    }
}

android {
    namespace 'com.example.mynavigation.drawer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.mynavigation.drawer'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword keystoreProperties.getProperty('KEYSTORE_PASSWORD', '')
            keyAlias keystoreProperties.getProperty('KEY_ALIAS', '')
            keyPassword keystoreProperties.getProperty('KEY_PASSWORD', '')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.recyclerview
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}